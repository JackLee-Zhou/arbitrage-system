# golangci-lint v2 配置 — arbitrage-system 项目级规则
# 文档：https://golangci-lint.run/docs/product/migration-guide/
version: "2"

run:
  timeout: 3m
  tests: true
  modules-download-mode: readonly
  go: "1.22"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: strict
    paths:
      - generated/
      - ".*\\.pb\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/arbitrage-system
  exclusions:
    paths:
      - generated/
      - ".*\\.pb\\.go$"
