[project]
name = "intel-collector"
version = "0.1.0"
description = "舆情采集服务 — 三层数据源（国内/海外/社交）统一采集"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "redis>=5.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "influxdb-client>=1.44.0",
    "pyyaml>=6.0",
    "simhash>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",
]
exclude = ["generated/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = "test_*.py"
asyncio_mode = "auto"
